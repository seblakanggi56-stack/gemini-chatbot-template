<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="chat-header">
      <div class="brand-info">
        <div id="header-avatar" class="bot-avatar">🤖</div>
        <div>
          <h1 id="header-title" class="bot-title">AI Assistant</h1>
          <p id="header-subtitle" class="bot-subtitle">Powered by Gemini</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="btn-theme-toggle" class="icon-btn" title="Toggle Theme">
          <span id="theme-icon">☀️</span>
        </button>
        <button type="button" id="btn-export-chat" class="icon-btn" title="Export Chat">
          💾
        </button>
        <button type="button" id="btn-clear-chat" class="icon-btn" title="Clear Chat">
          🗑️
        </button>
      </div>
    </header>

    <main id="chat-viewport" class="chat-viewport">
      <section id="welcome-screen" class="welcome-screen">
        <div class="welcome-hero">
          <div id="hero-avatar" class="hero-avatar">🤖</div>
          <h2 id="welcome-heading">Hello! How can I help?</h2>
          <p id="welcome-subtext">Ask me anything or pick a prompt below.</p>
        </div>
        <div id="intro-cards-grid" class="intro-cards-grid"></div>
      </section>

      <div id="messages-container" class="messages-container"></div>
    </main>

    <footer class="chat-footer">
      <form id="chat-form" class="input-wrapper">
        <textarea id="user-input" rows="1" placeholder="Type your message here..."></textarea>
        <button type="submit" id="btn-send" class="send-btn" aria-label="Send">➤</button>
      </form>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="knowledge.js"></script>
  <script src="app.js"></script>
</body>
</html>
