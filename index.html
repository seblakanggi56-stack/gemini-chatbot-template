<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMK Pertiwi Kuningan AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <!-- Tombol Garis Tiga di Pojok Kiri Atas -->
        <div class="menu-wrapper">
          <button type="button" id="btn-menu-toggle" class="icon-btn" aria-label="Menu Pengaturan" title="Menu">
            ☰
          </button>
          <div id="menu-dropdown" class="menu-dropdown hidden">
            <div class="menu-school-header">SMK PERTIWI KUNINGAN</div>
            <button type="button" id="btn-new-chat" class="menu-item">
              <span>➕</span> <span>Obrolan Baru</span>
            </button>
            <button type="button" id="btn-theme-toggle" class="menu-item">
              <span id="theme-icon">☀️</span> <span id="theme-label">Mode Terang</span>
            </button>
            <button type="button" id="btn-export-chat" class="menu-item">
              <span>💾</span> <span>Simpan Obrolan</span>
            </button>
            <button type="button" id="btn-clear-chat" class="menu-item danger">
              <span>🗑️</span> <span>Hapus Riwayat</span>
            </button>
          </div>
        </div>

        <div id="header-avatar" class="header-avatar">🤖</div>
        <div class="header-info">
          <h1 id="header-title">SMK Pertiwi Kuningan</h1>
          <p id="header-subtitle">Asisten Virtual Sekolah</p>
        </div>
      </div>
    </header>

    <!-- Area Chat Utama -->
    <main id="chat-viewport" class="chat-viewport">
      <section id="welcome-screen" class="welcome-screen">
        <div id="hero-avatar" class="hero-avatar">🤖</div>
        <h2 id="welcome-heading">Halo! Ada yang bisa dibantu?</h2>
        <p id="welcome-subtext">Tanyakan informasi seputar SMK Pertiwi Kuningan, jurusan, atau pendaftaran.</p>
        <div id="intro-cards-grid" class="intro-cards-grid"></div>
      </section>

      <div id="messages-container" class="messages-container"></div>
    </main>

    <!-- Kolom Input Pesan -->
    <footer class="chat-footer">
      <form id="chat-form" class="input-wrapper">
        <textarea id="user-input" rows="1" placeholder="Ketik pertanyaan Anda di sini..."></textarea>
        <button type="submit" id="btn-send" class="send-btn" aria-label="Kirim">➤</button>
      </form>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="knowledge.js"></script>
  <script src="app.js"></script>
</body>
</html>
